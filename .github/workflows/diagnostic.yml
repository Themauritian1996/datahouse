name: Diagnostic des sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sondes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Sondes
        shell: python
        run: |
          import json, requests
          out = []
          def p(*a): out.append(' '.join(str(x) for x in a))
          H = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36'}
          import io, csv
          r = requests.get('https://www.donneesquebec.ca/recherche/api/3/action/package_show', params={'id': 'profil-financier-des-municipalites-locales'}, timeout=60, headers=H)
          for res in r.json()['result']['resources']:
              p('RES', res.get('format'), '|', res.get('name'), '|', res.get('url'))
          raw = requests.get('https://mamh.gouv.qc.ca/fichiersdonneesouvertes/PF-2024-2025.csv', timeout=120, headers=H).content.decode('utf-8-sig')
          rows = list(csv.reader(io.StringIO(raw), delimiter=';' if raw.splitlines()[0].count(';') > raw.splitlines()[0].count(',') else ','))
          head = rows[0]
          for r_ in rows[1:]:
              if r_[2] in ('66023', '65005', '23027', '58227', '94068'):
                  p('PF', r_[3], [(head[i], r_[i]) for i in range(12, len(head))])
          for res in r.json()['result']['resources']:
              n = (res.get('name') or '').lower()
              if any(k in n for k in ('dictionnaire', 'métadonnées', 'metadonnees', 'description', 'variables', 'guide')):
                  try:
                      d = requests.get(res['url'], timeout=120, headers=H)
                      txt = d.content.decode('utf-8-sig', errors='replace')
                      for line in txt.splitlines():
                          if 'FIALX' in line or 'taux' in line.lower():
                              p('DICO', line[:300])
                  except Exception as e: p('DICO erreur', e)
          open('diag.txt', 'w').write('\n'.join(out))
          print('\n'.join(out))
      - name: Publication du résultat
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view diagnostic >/dev/null 2>&1 || gh release create diagnostic --title "Diagnostic" --notes "Résultats techniques des sondes."
          gh release upload diagnostic diag.txt --clobber
