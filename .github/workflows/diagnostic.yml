name: Diagnostic des sources

on:
  workflow_dispatch:

jobs:
  recensement:
    runs-on: ubuntu-latest
    steps:
      - name: Tableaux du recensement 2021 par subdivision (serveur www150)
        shell: python
        run: |
          import json, os, urllib.request
          S = open(os.environ['GITHUB_STEP_SUMMARY'], 'a')
          def out(t): print(t); S.write(t + '\n\n')
          req = urllib.request.Request('https://www150.statcan.gc.ca/t1/wds/rest/getAllCubesListLite', headers={'User-Agent': 'Mozilla/5.0'})
          cubes = json.load(urllib.request.urlopen(req, timeout=120))
          out(f'{len(cubes)} tableaux')
          keys = ('income', 'tenure', 'shelter', 'rent', 'dwelling value', 'mobility', 'age', 'owner')
          for c in cubes:
              pid = str(c.get('productId'))
              t = (c.get('cubeTitleEn') or '')
              if pid.startswith('9810') and ('subdivision' in t.lower() or 'municipalit' in t.lower()):
                  out(f"{pid} | {t} | {c.get('cubeEndDate')}")
