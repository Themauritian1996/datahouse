name: Diagnostic des sources

on:
  workflow_dispatch:

jobs:
  recensement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - name: Structure des tableaux du recensement
        shell: python
        run: |
          import io, os, zipfile, requests, pandas as pd
          S = open(os.environ['GITHUB_STEP_SUMMARY'], 'a')
          def out(t): print(t); S.write(str(t) + '\n\n')
          for pid in ('98100057', '98100259', '98100022'):
              b = requests.get(f'https://www150.statcan.gc.ca/n1/tbl/csv/{pid}-eng.zip', headers={'User-Agent': 'Mozilla/5.0'}, timeout=600).content
              z = zipfile.ZipFile(io.BytesIO(b)); n = [x for x in z.namelist() if 'Meta' not in x][0]
              out(f'## {pid} : {len(b)/1e6:.0f} Mo zip')
              head = pd.read_csv(z.open(n), nrows=5, dtype=str, encoding='utf-8-sig')
              out('COLONNES : ' + ' | '.join(head.columns))
              mtl = []
              for ch in pd.read_csv(z.open(n), chunksize=300000, dtype=str, encoding='utf-8-sig'):
                  mtl.append(ch[ch['DGUID'].astype(str).str.endswith('2466023')])
              m = pd.concat(mtl)
              out(f'Lignes Montréal : {len(m)}')
              for c in m.columns:
                  if c in ('REF_DATE', 'GEO', 'DGUID', 'COORDINATE', 'VECTOR', 'UOM_ID', 'SCALAR_ID', 'SCALAR_FACTOR', 'STATUS', 'SYMBOL', 'TERMINATED', 'DECIMALS', 'VALUE', 'UOM'):
                      continue
                  u = m[c].dropna().unique().tolist()
                  out(f'- {c} ({len(u)}) : ' + ' ; '.join(map(str, u[:40])))
              out('```\n' + m.head(12).to_string()[:3000] + '\n```')
