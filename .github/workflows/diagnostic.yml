name: Diagnostic des sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sondes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Sondes
        shell: python
        run: |
          import json, requests
          out = []
          def p(*a): out.append(' '.join(str(x) for x in a))
          H = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36'}
          import io, csv
          for u in ['https://mamh.gouv.qc.ca/fichiersdonneesouvertes/PF-2024-2025.csv',
                    'https://mamh.gouv.qc.ca/fichiersdonneesouvertes/Données-prévisionnelles-non-auditées-2026-SimpleOccurrence.csv']:
              try:
                  r = requests.get(u, timeout=300, headers=H)
                  raw = r.content
                  for enc in ('utf-8-sig', 'cp1252', 'latin-1'):
                      try: txt = raw.decode(enc); break
                      except Exception: pass
                  p('FICHIER', r.status_code, len(raw), enc, u)
                  first = txt.splitlines()[:3]
                  delim = ';' if first[0].count(';') > first[0].count(',') else ','
                  rows = list(csv.reader(io.StringIO(txt), delimiter=delim))
                  head = rows[0]
                  p('  nb colonnes', len(head), 'nb lignes', len(rows))
                  p('  entêtes (60 premières):', head[:60])
                  hits = [ (i,h) for i,h in enumerate(head) if any(k in h.lower() for k in ('taux', 'tgt', 'foncier', 'résiden', 'residen'))]
                  p('  colonnes taux/foncier:', hits[:80])
                  mtl = [r_ for r_ in rows[1:] if any('Montréal' == c.strip() or '66023' in c for c in r_[:6])][:2]
                  for r_ in mtl:
                      p('  MTL:', [(head[i], r_[i]) for i,_ in hits[:40] if i < len(r_)])
                      p('  MTL début:', list(zip(head[:12], r_[:12])))
                  if len(head) < 15:
                      for r_ in rows[1:6]: p('  ligne:', r_)
                      codes = {}
                      for r_ in rows[1:]:
                          if len(r_) > 3: codes[r_[2] if len(r_)>2 else ''] = r_
                      p('  exemples codes:', list(codes.items())[:3])
              except Exception as e: p('FICHIER erreur', type(e).__name__, e, u)
          open('diag.txt', 'w').write('\n'.join(out))
          print('\n'.join(out))
      - name: Publication du résultat
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view diagnostic >/dev/null 2>&1 || gh release create diagnostic --title "Diagnostic" --notes "Résultats techniques des sondes."
          gh release upload diagnostic diag.txt --clobber
