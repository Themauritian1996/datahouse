<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pignon — Le prix juste, chiffres en main.</title>
  <meta name="description" content="Estimation du prix des propriétés partout au Québec à partir des données publiques : valeur, comparables, loyers, rendement, secteur et facilité de revente.">
  <meta name="theme-color" content="#0b0b0b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <script>window.PIGNON_VERSION = '__VERSION__';
    (function () { try { var t = localStorage.getItem('pignon:theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch (e) {} })();</script>
  <link rel="stylesheet" href="lib/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css?v=__VERSION__">
  <script src="lib/maplibre-gl.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Accueil">
      <svg viewBox="0 0 32 32" class="logo" aria-hidden="true"><path d="M4 15 16 5l12 10v12H4z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M12 27v-7h8v7" fill="none" stroke="currentColor" stroke-width="2.6"/></svg>
      <span>Pignon</span>
    </a>
    <div class="search">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Adresse, ville ou quartier" autocomplete="off" aria-label="Rechercher une adresse ou une ville">
      <div id="results" class="results" hidden></div>
    </div>
    <button class="btn icon-btn" id="theme" title="Thème" aria-label="Changer de thème"><svg class="ic" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    <button class="btn icon-btn" id="account" aria-label="Compte"></button>
    <nav id="menu" class="menu">
      <a href="#/compte">Mon compte</a>
      <a href="#/favoris" id="menu-fav" hidden>Mes favoris</a>
      <a href="#/tarifs">Forfaits</a>
      <a href="#/methodo">Méthodologie et sources</a>
      <a href="#/legal">Conditions et confidentialité</a>
    </nav>
  </header>

  <div id="demo" class="demo" hidden>Données de démonstration simulées : les valeurs affichées ne sont pas réelles.</div>

  <main class="stage">
    <div id="map" aria-label="Carte"></div>
    <div id="metrics" class="metrics" role="toolbar" aria-label="Indicateur affiché">
      <button class="chip on" data-m="v">Prix</button>
      <button class="chip" data-m="g">Tendance</button>
      <button class="chip" data-m="y">Rendement</button>
      <button class="chip" data-m="l">Revente</button>
      <button class="chip icon-chip" id="legend-toggle" aria-label="Légende"><svg class="ic" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
    </div>
    <div id="legend" class="legend"></div>
    <div id="zoomhint" class="zoomhint">Zoomez pour voir chaque propriété</div>
  </main>

  <aside id="sheet" class="sheet" hidden aria-live="polite">
    <div class="handle" aria-hidden="true"><span></span></div>
    <button class="btn icon-btn sheet-close" aria-label="Fermer"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="sheet-body"></div>
  </aside>

  <section id="page" class="page" hidden></section>
  <div id="rapport" class="print"></div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="js/app.js?v=__VERSION__"></script>
</body>
</html>
